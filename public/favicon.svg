<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    
    <!-- Outer Glow Accent -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Sparkle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Squircle Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#090d16" stroke="url(#borderGrad)" stroke-width="2" />
  
  <!-- Vibrant Gradient Badge -->
  <rect x="7" y="7" width="50" height="50" rx="13" fill="url(#bgGrad)" />

  <!-- Device / Screen Notch -->
  <rect x="26" y="11" width="12" height="3" rx="1.5" fill="#090d16" opacity="0.4" />

  <!-- Mockup Preview Card -->
  <rect x="13" y="19" width="38" height="25" rx="6" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />
  <rect x="17" y="23" width="15" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.9" />
  <rect x="17" y="29" width="30" height="2.5" rx="1.2" fill="#ffffff" fill-opacity="0.6" />
  <rect x="17" y="34" width="22" height="2.5" rx="1.2" fill="#ffffff" fill-opacity="0.6" />

  <!-- Interactive Action Dots -->
  <circle cx="18" cy="40" r="1.5" fill="#ffffff" fill-opacity="0.8" />
  <circle cx="24" cy="40" r="1.5" fill="#ffffff" fill-opacity="0.8" />
  <circle cx="30" cy="40" r="1.5" fill="#ffffff" fill-opacity="0.8" />

  <!-- Glowing Magic Sparkles -->
  <g filter="url(#glow)">
    <!-- Primary Magic Sparkle -->
    <path d="M47 13 C47 18.5, 49.5 21, 55 21 C49.5 21, 47 23.5, 47 29 C47 23.5, 44.5 21, 39 21 C44.5 21, 47 18.5, 47 13 Z" fill="#ffffff" />
    <!-- Secondary Cyan Sparkle -->
    <path d="M16 46 C16 48.5, 17.5 50, 20 50 C17.5 50, 16 51.5, 16 54 C16 51.5, 14.5 50, 12 50 C14.5 50, 16 48.5, 16 46 Z" fill="#38bdf8" />
  </g>
</svg>
